<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>MI-CHARTS</title>
<style>
:root{--bg:#0f1115;--text:#e8eaed;--surface:#181b21;--border:#2a2e37;--muted:#8b919c;--accent:#2962ff;--accent-t:#fff;--up:#26a69a;--down:#ef5350}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;letter-spacing:.1px;height:100%;background:var(--bg);color:var(--text);font-family:var(--ui,system-ui),"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.tab{display:none;flex:1;min-height:0;flex-direction:column}
.tab.on{display:flex}
nav{display:flex;border-top:1px solid var(--border);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:8px 0 6px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--accent)}
body.fs nav{display:none}
/* markets */
.top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 6px}
.top h1{font-size:17px;margin:0;flex:1;letter-spacing:.5px}
.sbtn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:13px}
.sbtn.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
#chips{display:flex;gap:6px;overflow-x:auto;padding:4px 12px 8px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:6px 14px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-t)}
#strip{font-size:11px;padding:0 12px 6px;color:var(--muted);display:flex;gap:8px;align-items:center}
#strip .badge{background:#b8860b;color:#fff;border-radius:4px;padding:1px 6px}
#strip .badge.live{background:#1b7a43}
#rows{flex:1;overflow-y:auto;padding:0 8px}
.row{display:flex;align-items:center;gap:8px;padding:10px 8px;border-bottom:1px solid var(--border);border-radius:6px}
.row:active{background:var(--surface)}
.row .rl{flex:1;min-width:0}
.row .rl b{font-size:15px;display:flex;align-items:center;gap:6px}
.row .rl small{color:var(--muted);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .px{font-variant-numeric:tabular-nums;font-size:15px;min-width:84px;text-align:right}
.row .pct{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;min-width:78px;text-align:center;padding:6px 4px;border-radius:6px;background:var(--surface)}
.up{color:var(--up)}.dn{color:var(--down)}
.pct.up{background:rgba(38,166,154,.16)}.pct.dn{background:rgba(239,83,80,.16)}
.row.fu .px{animation:fu .7s}.row.fd .px{animation:fd .7s}
@keyframes fu{0%{color:var(--up)}100%{color:var(--text)}}
@keyframes fd{0%{color:var(--down)}100%{color:var(--text)}}
.sd{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sd.o{background:var(--up)}.sd.c{background:var(--down)}
.rmv{background:var(--down);color:#fff;border:0;border-radius:50%;width:26px;height:26px;font-size:18px;line-height:1;flex:none}
.empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:14px}
/* chart */
#chartWrap{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;touch-action:none;display:block}
#hdr{position:absolute;left:8px;top:calc(6px + env(safe-area-inset-top));pointer-events:none;z-index:3}
body:not(.fs) #hdr{top:6px}
#hdr .nm{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px}
#hdr .nm i{font-style:normal;font-weight:500;color:var(--muted);font-size:13px}
#hdr .ohlc{font-size:11px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
#stDot{pointer-events:auto;width:18px;height:18px;border-radius:9px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0}
#stDot span{width:8px;height:8px;border-radius:50%;background:var(--muted);display:block}
#pop{position:absolute;left:8px;top:54px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;z-index:5;display:none;max-width:260px}
#msg{position:absolute;left:0;right:66px;top:42%;text-align:center;color:var(--muted);font-size:13px;padding:0 16px;z-index:2}
#msg button{margin-top:8px}
#selbar{position:absolute;top:58px;right:74px;display:none;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:5px 8px;z-index:4}
#selbar .col{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);padding:0}
#selbar .col.on{border-color:var(--text)}
#selbar button.del{background:var(--down);color:#fff;border:0;border-radius:6px;padding:4px 8px;font-size:12px}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;background:var(--accent);color:var(--accent-t);border-radius:16px;padding:5px 12px;font-size:12px;display:none;z-index:4;white-space:nowrap;gap:8px;align-items:center}
#hint button{background:none;border:0;color:inherit;padding:0 0 0 6px;font-size:14px}
.tbar{border-top:1px solid var(--border);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
.tr{display:flex;align-items:center;min-height:42px}
.tr+.tr{border-top:1px solid var(--border)}
.tbtn{background:none;border:0;padding:8px 11px;display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text);min-height:42px}
.tbtn.on{color:var(--accent)}
.tbtn[disabled]{opacity:.3}
#symBtn{font-weight:700;border-right:1px solid var(--border);flex:none;padding:8px 10px}
#tfs{display:flex;flex:none}
#tfs .tbtn{font-weight:700;border-right:1px solid var(--border);padding:8px 10px}
.tr .sp1{flex:1}
.sp1{flex:1}
/* settings */
#setBar{padding:calc(12px + env(safe-area-inset-top)) 12px 0;display:flex;flex-direction:column;gap:10px}
.barrow{border:2px solid var(--border);border-radius:16px;background:var(--surface);padding:10px 10px 12px}
.barrow .lb{font-size:13px;color:var(--muted);margin:0 2px 8px;font-weight:600}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-width:0;border:2px solid var(--border);border-radius:12px;background:var(--bg);padding:9px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}
.seg button svg{width:24px;height:24px}
.seg button.on{border-color:var(--accent);color:var(--accent)}
.seg .sw1{height:34px;width:100%;border-radius:8px;border:1px solid var(--border)}
#setGrid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:12px;padding:12px}
.big{border:2px solid var(--border);border-radius:20px;background:linear-gradient(160deg,var(--surface),var(--bg));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:10px}
.big svg{width:40px;height:40px}
.big b{font-size:18px}
.big small{color:var(--muted);font-size:12px;word-break:break-all}
.big:active{border-color:var(--accent)}
.big.act{border-color:var(--accent)}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:50}
#sheet.on{display:flex}
#sheet{bottom:var(--kb,0px);transition:bottom .12s ease-out}
.sp{background:var(--bg);border-top:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-height:82%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;font-size:16px}
.sh .x{background:none;border:0;font-size:18px;color:var(--muted)}
.sb{overflow-y:auto;padding:4px 14px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;text-align:center}
.gi.on{border-color:var(--accent);color:var(--accent)}
.li{display:flex;align-items:center;gap:10px;padding:11px 6px;border-bottom:1px solid var(--border);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font-size:15px}
.li .r{margin-left:auto;font-size:13px;color:var(--muted)}
.li .ck{width:22px;color:var(--accent);font-weight:700}
input[type=text],input[type=email]{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:11px;font-size:15px;margin:6px 0;-webkit-user-select:text;user-select:text}
.pbtn{background:var(--accent);color:var(--accent-t);border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;width:100%;margin-top:8px}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.sw button{width:46px;height:46px;border-radius:12px;border:2px solid var(--border);padding:0}
.crow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0;font-size:14px}
input[type=color]{width:70px;height:42px;border:1px solid var(--border);border-radius:8px;background:none;padding:2px}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;border-radius:18px;padding:8px 16px;font-size:13px;z-index:99;display:none;max-width:86%;text-align:center}
.note{color:var(--muted);font-size:12px;margin:8px 0}
#shot{width:100%;border-radius:8px;border:1px solid var(--border)}

.lb2{font-size:12px;color:var(--muted);margin:14px 2px 4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0}
.pc{aspect-ratio:1;border-radius:50%;border:2px solid var(--border);padding:0;min-height:34px}
.pc.on{border-color:var(--text);box-shadow:0 0 0 2px var(--accent)}
.rng{width:100%;-webkit-appearance:none;appearance:none;height:8px;border-radius:6px;background:linear-gradient(90deg,var(--up),var(--accent),var(--down));outline:none;margin:14px 0 6px}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--text);border:4px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.rng::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--text);border:4px solid var(--accent)}
.rl2{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.sp{border-radius:22px 22px 0 0}
#legend{position:absolute;left:8px;top:52px;display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100% - 132px);z-index:3;pointer-events:none}
.lg{pointer-events:auto;display:flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px solid transparent;border-radius:7px;padding:2px 7px;font-size:11px;color:var(--text)}
.lg i{width:8px;height:8px;border-radius:50%;display:block}
.lg b{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.lg.on{border-color:var(--accent)}.lg.off{opacity:.45}
#selbar{position:absolute;top:84px;right:72px;display:none;flex-direction:column;gap:2px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:3px;z-index:6;box-shadow:0 6px 22px rgba(0,0,0,.4)}
#selbar button{background:none;border:0;border-radius:9px;width:38px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--text);padding:0}
#selbar button:active{background:var(--bg)}
#selbar svg{width:22px;height:22px}
.cdot{width:20px;height:20px;border-radius:50%;border:2px solid var(--text);display:block}
.wtx{font-size:18px;font-family:Georgia,serif;font-weight:700}
#pov{position:absolute;right:122px;display:none;z-index:7;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#pov .pal{width:232px;margin:0}
#pov .pv{display:flex;align-items:center;justify-content:center;width:150px;height:40px;background:none;border:1px solid transparent;border-radius:9px;margin:2px 0;color:var(--text)}
#pov .pv.on{border-color:var(--accent);background:var(--bg)}
#pov .pv svg{width:110px;height:24px}
#favBar{display:none;gap:6px;overflow-x:auto;padding:6px 8px;border-top:1px solid var(--border);background:var(--surface);scrollbar-width:none}
#favBar::-webkit-scrollbar{display:none}
.fv{flex:none;display:flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:5px 11px;font-size:12px}
.fv.on{border-color:var(--accent)}.fv b{font-weight:600}
#latestBtn{position:absolute;right:72px;bottom:30px;display:none;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);z-index:4;box-shadow:0 4px 14px rgba(0,0,0,.4);padding:0}
#latestBtn svg{width:20px;height:20px}
.tbtn svg{stroke-width:1.6}
#hint{white-space:normal;max-width:92%;text-align:center;bottom:38px}
#toolFav{display:none;gap:6px;overflow-x:auto;padding:6px 8px;border-bottom:1px solid var(--border);background:var(--surface);scrollbar-width:none}
#toolFav::-webkit-scrollbar{display:none}
.tf{width:44px;height:36px;border-radius:10px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);flex:none;padding:0}
.tf.on{border-color:var(--accent);color:var(--accent)}
.tf svg{width:20px;height:20px}
#selbar{touch-action:none}
#savePop{position:fixed;display:flex;gap:10px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;transform:translateY(10px) scale(.92);pointer-events:none;transition:opacity .18s,transform .18s;z-index:60}
#savePop.on{opacity:1;transform:none;pointer-events:auto}
.sp-b{width:68px;height:68px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--text);padding:0}
.sp-b svg{width:22px;height:22px}
#sheet .sh{touch-action:none}
.grip{width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);border-radius:50%;color:var(--muted);font-size:16px;touch-action:none;cursor:grab}
.dragging{opacity:.85;box-shadow:0 10px 24px rgba(0,0,0,.45);z-index:5;position:relative}
.dropt{outline:2px dashed var(--accent);outline-offset:2px}
#rows.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;align-content:start}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;min-height:88px;display:flex;flex-direction:column;position:relative}
.tile:active{border-color:var(--accent)}
.tile .tn{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;padding-right:70px}
.tile .tsub{color:var(--muted);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tst{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.tile .px{font-variant-numeric:tabular-nums;font-size:15px}
.tile .pct{font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;padding:3px 7px;border-radius:6px;background:var(--bg)}
.tmv{display:flex;gap:4px;position:absolute;top:8px;right:8px}
.tmv .rmv{width:24px;height:24px;font-size:15px}
.tmv .mvb{background:var(--surface);color:var(--text);border:1px solid var(--border)}
#rows .row .tmv{position:static}
#favBar{display:none!important}
.sbtn.ibt{display:flex;align-items:center;justify-content:center;padding:6px 9px}
.sbtn.ibt svg{width:20px;height:20px}
#toolFav{position:absolute;left:0;top:0;z-index:4;display:flex;align-items:center;gap:6px;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);touch-action:none;max-width:calc(100% - 12px);overflow:hidden}
#toolFav.v{flex-direction:column}
#toolFav.h{flex-direction:row}
#toolFav .tfg{width:20px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;letter-spacing:-2px;cursor:grab;flex:none}
#toolFav .tfo{font-size:15px}
#imgBtn,#indBtn,#mgrBtn{display:none!important}
#toolFav{gap:4px;padding:4px;border-radius:12px;background:color-mix(in srgb,var(--surface) 72%,transparent);border:1px solid color-mix(in srgb,var(--border) 60%,transparent);box-shadow:0 4px 14px rgba(0,0,0,.22);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#toolFav .tfg{width:14px;height:24px;font-size:9px;letter-spacing:-2px;color:var(--muted);opacity:.7}
#toolFav .tfo{width:28px;height:28px;font-size:12px;border-radius:8px;opacity:.8}
#toolFav .tf{width:32px;height:28px;border-radius:8px;background:transparent;border:1px solid transparent;opacity:.85}
#toolFav .tf.on{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);opacity:1}
#toolFav .tf svg{width:15px;height:15px;stroke-width:1.6}
#toolFav{padding:3px;gap:3px;border-radius:11px}
#toolFav .tfg{height:20px;width:12px}
#toolFav .tfo{width:24px;height:24px;font-size:11px}
#toolFav .tf{width:28px;height:26px;border-radius:7px}
#toolFav .tf svg{width:14px;height:14px}
#selbar{padding:3px 2px;gap:1px;border-radius:12px;background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.25);border:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
#selbar .sbg{width:100%;text-align:center;font-size:9px;line-height:12px;color:var(--muted);letter-spacing:-2px;cursor:grab;touch-action:none;opacity:.7}
#selbar button{width:28px;height:28px;border-radius:8px}
#selbar svg{width:15px;height:15px;stroke-width:1.6}
#selbar .cdot{width:14px;height:14px}
#selbar .wtx{font-size:14px}
#toolFav .tf.on{background:rgba(160,166,176,.14);border-color:rgba(160,166,176,.32)}
#toolFav .tf svg{stroke-width:1.5}

.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;border-radius:12px;border:1px solid var(--border);background:#fff;color:#222;font-weight:600;font-size:15px}
.ral{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--border);font-size:14px}
.ral .nm{flex:1;min-width:0}.ral .nm small{display:block;color:var(--muted);font-size:11px}
.ral.off .nm{opacity:.5}
.tg{width:46px;height:26px;border-radius:13px;background:var(--surface);border:1px solid var(--border);position:relative;padding:0;flex:none}
.tg i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.15s}
.tg.on{background:var(--accent);border-color:var(--accent)}.tg.on i{left:22px;background:#fff}
#setGrid{grid-template-rows:1fr 1fr!important}

/* ===== pro-tech skin ===== */
.sp{background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 70%,var(--bg)),var(--bg));border-top:1px solid color-mix(in srgb,var(--accent) 45%,var(--border));box-shadow:0 -12px 40px rgba(0,0,0,.45)}
.sh{padding:14px 16px 6px}
.sh b{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700}
.sh .x{width:30px;height:30px;border-radius:50%;background:var(--surface);border:1px solid var(--border);font-size:14px}
.pbtn{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 65%,#000));border-radius:12px;letter-spacing:.4px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}

function isOpenAt(sym, d){

function mstatus(sym){

function posStatus(d){

const ROW=22;
function bindDrum(el,listFn,curFn,pickFn,labelFn){

  const rerender=()=>rollRender(tgt(),listFn(),curFn(),labelFn);
  const stepOnce=dir=>{ const before=curFn(); pickFn(dir); if(curFn()===before) return false; rerender(); return true; };
  const settle=()=>{ let g=0;
    while(pos<=-ROW/2&&g++<4){ if(!stepOnce(1)){ pos=-ROW/2+1; v=0; break; } pos+=ROW; }
    while(pos>=ROW/2&&g++<4){ if(!stepOnce(-1)){ pos=ROW/2-1; v=0; break; } pos-=ROW; } };
  const frame=now=>{ raf=0; if(tracking) return; const dt=Math.min(32,Math.max(1,now-last)); last=now;
    if(Math.abs(v)>0.015){ pos+=v*dt; v*=Math.exp(-dt/150); }
    else { v=0; pos*=Math.exp(-dt/60); if(Math.abs(pos)<0.25){ pos=0; apply(); return; } }

  const kick=()=>{ if(raf) cancelAnimationFrame(raf); last=performance.now(); raf=requestAnimationFrame(frame); };
  el.addEventListener('touchstart',e=>{ const t=e.touches[0]; st={y:t.clientY,t:performance.now()}; tracking=true; travel=0; v=0; if(raf){ cancelAnimationFrame(raf); raf=0; } },{passive:true});
  el.addEventListener('touchmove',e=>{ if(!st) return; e.preventDefault(); const y=e.touches[0].clientY, now=performance.now();

}

let mkDrag=false;
(function(){
  const rowsEl=$('#rows'); let dr=null;
  rowsEl.addEventListener('pointerdown',e=>{
    const g=e.target.closest('.grip'); if(!g||!editMode) return;
    const el=g.closest('[data-sym]'); mkDrag=true;
    dr={sym:el.dataset.sym, el, sx:e.clientX, sy:e.clientY, over:null};
    el.classList.add('dragging'); g.setPointerCapture(e.pointerId); e.preventDefault();
  });
  rowsEl.addEventListener('pointermove',e=>{
    if(!dr) return;
    dr.el.style.transform='translate('+(e.clientX-dr.sx)+'px,'+(e.clientY-dr.sy)+'px)';
    dr.over=null;
    rowsEl.querySelectorAll('[data-sym]').forEach(o=>{
      o.classList.remove('dropt'); if(o===dr.el) return;
      const r=o.getBoundingClientRect();
      if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){ o.classList.add('dropt'); dr.over=o.dataset.sym; }
    });
  });
  const end=()=>{
    if(!dr) return; const d=dr; dr=null; mkDrag=false;
    d.el.classList.remove('dragging'); d.el.style.transform='';
    rowsEl.querySelectorAll('.dropt').forEach(o=>o.classList.remove('dropt'));
    if(d.over&&d.over!==d.sym){ const L=curList(), from=L.syms.indexOf(d.sym), to=L.syms.indexOf(d.over); if(from>=0&&to>=0){ L.syms.splice(from,1); L.syms.splice(to,0,d.sym); save(); } }
    renderMarkets();
  };
  rowsEl.addEventListener('pointerup',end); rowsEl.addEventListener('pointercancel',end);
})();

function jTradesHTML(a){
  if(!a) return '<div class="jempty">Add an account to start your journal.</div>';

  const groups={};
  a.trades.slice().sort((x,y)=>(y.date+(y.created||'')).localeCompare(x.date+(x.created||''))).forEach(t=>{ const k=jMon(t.date); (groups[k]=groups[k]||[]).push(t); });
  return Object.keys(groups).sort().reverse().map(w=>{
    const ts=groups[w], wp=ts.reduce((s,t)=>s+(jPctOf(jPnl(t),a)||0),0), hasC=ts.some(t=>jPnl(t)!=null);
    return '<div class="jwk" data-wk="'+w+'"><span>'+jFmt(w)+' - '+jFmt(jAddDays(w,6))+'</span><b class="'+jCls(wp)+'">'+(hasC?jSigned(wp)+'%':'')+'</b></div>'+ts.map(jCardHTML).join('');

  const tot=cl.reduce((s,x)=>s+x.p,0), wins=cl.filter(x=>x.p>0), los=cl.filter(x=>x.p<0);

function sma(a,n){ if(a.length<n) return null; let s=0; for(let i=a.length-n;i<a.length;i++) s+=a[i]; return s/n; }
function ema(a,n){ if(a.length<n) return null; const k=2/(n+1); let e=a.slice(0,n).reduce((x,y)=>x+y,0)/n; for(let i=n;i<a.length;i++) e=a[i]*k+e*(1-k); return e; }
function rsi(a,n){ n=n||14; if(a.length<n+1) return null; let g=0,l=0; for(let i=1;i<=n;i++){ const d=a[i]-a[i-1]; if(d>0) g+=d; else l-=d; } g/=n; l/=n; for(let i=n+1;i<a.length;i++){ const d=a[i]-a[i-1]; g=(g*(n-1)+Math.max(d,0))/n; l=(l*(n-1)+Math.max(-d,0))/n; } return l===0?100:100-100/(1+g/l); }
function atr(c,n){ n=n||14; if(c.length<n+1) return null; let s=0; for(let i=c.length-n;i<c.length;i++){ const p=c[i-1].c; s+=Math.max(c[i].h-c[i].l,Math.abs(c[i].h-p),Math.abs(c[i].l-p)); } return s/n; }

async function callLLM(system,user,hist,maxTok){
  const prov=A.provider, key=(A.keys[prov]||'').trim(), model=(A.models[prov]||DEFA.models[prov]).trim();
  if(!key) throw new Error('NOKEY');
  const ac=new AbortController(), tm=setTimeout(()=>ac.abort(),35000);
  const nice=(r,j)=>{ const m=(j&&j.error&&(j.error.message||j.error))||''; if(r.status===400&&/api key/i.test(m)) return L('That key was rejected — copy it again (no spaces).','密钥无效，请重新复制（不要有空格）。'); if(r.status===403) return L('Key not allowed for this model/region: ','密钥无权使用此模型或地区：')+String(m).slice(0,120); if(r.status===404) return L('Model name not found — check the Model box.','找不到该模型，请检查“模型”输入框。'); if(r.status===429) return L('Free limit reached for now — wait a minute and try again.','免费额度暂时用完，请稍等一分钟再试。'); return String(m||('HTTP '+r.status)); };
  try{
    if(prov==='claude'){
      const msgs=(hist||[]).map(h=>({role:h.role,content:h.text})).concat([{role:'user',content:user}]);
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:ac.signal,headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:maxTok||1500,system,messages:msgs})});
      let j={}; try{ j=await r.json(); }catch(_){}
      if(!r.ok) throw new Error(nice(r,j)); const out=(j.content||[]).map(x=>x.text||'').join(''); if(!out) throw new Error(L('Empty answer','AI 没有返回内容')); return out;
    }
    const contents=(hist||[]).map(h=>({role:h.role==='assistant'?'model':'user',parts:[{text:h.text}]})).concat([{role:'user',parts:[{text:user}]}]);
    /* Gemini 2.5 Flash "thinks" first and the thinking eats the output budget -> empty replies. Turn thinking off for the flash models. */
    const gc={temperature:.35,maxOutputTokens:Math.max(maxTok||2000,300),responseMimeType:'application/json'};
    if(/gemini-2\.5-flash/i.test(model)) gc.thinkingConfig={thinkingBudget:0};
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',signal:ac.signal,headers:{'content-type':'application/json','x-goog-api-key':key},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents,generationConfig:gc})});
    let j={}; try{ j=await r.json(); }catch(_){}
    if(!r.ok) throw new Error(nice(r,j));
    const c=j.candidates&&j.candidates[0]; const parts=c&&c.content&&c.content.parts;
    if(!parts||!parts.length) throw new Error(L('Empty answer','AI 没有返回内容')+(c&&c.finishReason?' ('+c.finishReason+')':(j.promptFeedback&&j.promptFeedback.blockReason?' ('+j.promptFeedback.blockReason+')':'')));
    return parts.map(p=>p.text||'').join('');
  }catch(e){ if(e&&e.name==='AbortError') throw new Error(L('The AI took too long — check your internet and try again.','AI 响应超时，请检查网络后重试。')); throw e; }
  finally{ clearTimeout(tm); }
}

const nrm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function resolveSym(v){ const n=nrm(v); if(!n) return null; if(INSTR[n]) return n;
  for(const k in INSTR){ const I=INSTR[k]; if(nrm(I.td)===n||nrm(I.n)===n||(I.n||'').toUpperCase().includes(String(v).toUpperCase())) return k; }
  const al={NASDAQ:'NAS100',NDX:'NAS100',OIL:'WTI',CRUDE:'WTI',EURO:'EURUSD',POUND:'GBPUSD',YEN:'USDJPY','纳斯达克':'NAS100','原油':'WTI'}; if(al[n]||al[String(v).trim()]) return al[n]||al[String(v).trim()];
  if(/^[A-Z]{6}$/.test(n)) return n; return null; }
function resolveTF(v){ let s=String(v||'').trim(); const m={'1d':'1D','d':'1D','day':'1D','daily':'1D','1w':'1W','w':'1W','week':'1W','weekly':'1W','1mo':'1M','mo':'1M','month':'1M','monthly':'1M','h1':'1h','h4':'4h','m1':'1m','m5':'5m','m15':'15m','m30':'30m','60m':'1h','240m':'4h','1H':'1h','4H':'4h','1hr':'1h','4hr':'4h'}; if(TFSEC[s]) return s; const k=s.toLowerCase(); if(m[s]) return m[s]; if(m[k]) return m[k]; if(TFSEC[k]) return k; const up=s.toUpperCase(); if(TFSEC[up]) return up; return null; }

      if(nm==='add_indicator') S.chart.inds[id]=true; else delete S.chart.inds[id]; legSig=''; calcInd(); save(); requestDraw(); return ok((nm==='add_indicator'?L('Added ','已添加 '):L('Removed ','已移除 '))+id.toUpperCase()); }
    case 'draw': { const tl=TOOLS.find(x=>x.id===a.tool); if(!tl) throw new Error('unknown tool '+a.tool); needChart(); const n=candles.length; if(!n) throw new Error('no chart data');
      const pts=(a.points||[]).map(p=>({t:i2t(n-1-Math.max(0,Math.round(+p.barsAgo||0))),p:Math.round(+p.price*1000)/1000})).filter(p=>isFinite(p.p));

      if(tl.id==='brush'||tl.id==='path') d.pts=pts;
      if((d.type==='long'||d.type==='short')&&d.pts.length===1){ const E0=d.pts[0], off=E0.p*0.01, sg=d.type==='long'?1:-1; d.pts.push({t:E0.t,p:E0.p+sg*off},{t:E0.t,p:E0.p-sg*off}); }
      if(d.type==='text') d.text=String(a.text||'').slice(0,80)||'Note';
      if(d.type==='fib'&&S.fibDef&&S.fibDef.levels&&S.fibDef.levels.length){ d.levels=S.fibDef.levels.slice(); d.lcols=d.levels.map((v,i)=>(S.fibDef.lcols&&S.fibDef.lcols[i])||FIBC[i%FIBC.length]); d.fibo=Object.assign({fill:true,labels:true,ext:false,fillC:null,fillA:.1},S.fibDef.fibo||{}); }
      DR.push(d); sel=d.id; commit(); return ok(L('Drew '+(tl.en||tl.id),'已绘制 '+(tl.zh||tl.id))); }
    case 'scroll_back': { needChart(); const un=String(a.unit||'bars'), amt=Math.abs(+a.amount||0); if(!amt) throw new Error('no amount'); const bars=un==='bars'?amt:amt*(UNIT[un]||3600)/tfs0();
      const target=Math.max(2,view.right-Math.round(bars)); const from=view.right, t0=performance.now(); await new Promise(res=>{ const st=now=>{ const k=Math.min(1,(now-t0)/450), e=1-Math.pow(1-k,3); view.right=from+(target-from)*e; try{ clampView(); }catch(_){} requestDraw(); if(k<1) requestAnimationFrame(st); else res(); }; requestAnimationFrame(st); });
      return ok(L('Scrolled back '+Math.round(bars)+' bars','已回滚 '+Math.round(bars)+' 根K线')); }
    case 'scroll_latest': needChart(); { const b=q('#latestBtn'); if(b) b.onclick&&b.onclick(); } return ok(L('Back to the latest candle','已回到最新K线'));
    case 'undo': undo(); return ok('Undo'); case 'redo': redo(); return ok('Redo');

    case 'music_stop': musicStop(); return ok(L('Music stopped','音乐已停止'));
    case 'music_shuffle': { const i=Math.floor(Math.random()*M.list.length); playTrack(i); return ok(L('Shuffled','随机播放')); }
    case 'music_add': { const t=String(a.title||'').trim(); if(!t) throw new Error('no title'); M.list.push({id:uid(),title:t.slice(0,80),artist:String(a.artist||'').slice(0,60),yt:ytId(a.link)}); saveM(); mRefresh(); return ok(L('Added “'+t+'”','已添加“'+t+'”')+(ytId(a.link)?'':L(' (no link yet)','（暂无链接）'))); }
    case 'music_remove': { const i=findTrack(a.query); if(i<0) throw new Error('song not found'); const nm2=M.list[i].title; removeTrack(i); return ok(L('Removed “'+nm2+'”','已删除“'+nm2+'”')); }

    default: throw new Error('unknown action '+nm);
  }
}

const ERRS=[]; addEventListener('error',e=>{ ERRS.push((e.message||'')+' @'+(e.lineno||'')+':'+(e.colno||'')); if(ERRS.length>6) ERRS.shift(); }); addEventListener('unhandledrejection',e=>{ ERRS.push('promise: '+(e.reason&&e.reason.message||e.reason)); if(ERRS.length>6) ERRS.shift(); });
const getP=()=>{ try{ return JSON.parse(localStorage.getItem('mi_patches')||'[]'); }catch(e){ return []; } };
const setP=p=>{ try{ localStorage.setItem('mi_patches',JSON.stringify(p)); }catch(e){} };
function applyEdits(src,edits){ for(const e of edits){ const i=src.indexOf(e.find); if(i<0) throw new Error('find text not found'); if(src.indexOf(e.find,i+1)>=0) throw new Error('find text is not unique'); src=src.slice(0,i)+e.repl+src.slice(i+e.find.length); } return src; }
function fnIndex(js){ const lines=js.split('\n'), out=[]; lines.forEach((ln,i)=>{ const m=ln.match(/^(?:async\s+)?function\s+([A-Za-z0-9_$]+)/); if(m) out.push({name:m[1],line:i}); }); return {lines,out}; }
function fnSource(ix,name){ const f=ix.out.find(x=>x.name===name); if(!f) return null; let e=f.line+1; while(e<ix.lines.length&&!/^(?:async\s+)?function\s|^(?:const|let|var|class)\s/.test(ix.lines[e])) e++; return ix.lines.slice(f.line,e).join('\n').slice(0,7000); }
function prog(msg,bad){ showCard(head(L('repair','修复'))+'<div class="mc-t">'+(bad?'':'<span class="mi-dots"><span></span><span></span><span></span></span> ')+esc(msg)+'</div>'); }
async function repair(desc){
  setState('thinking'); showDock(false);
  try{
    prog(L('Reading the app\'s code…','正在读取应用代码…'));
    const orig=document.getElementById('mi-main').textContent; const patches=getP().filter(p=>p.on); let eff=orig;
    for(const p of patches){ try{ eff=applyEdits(eff,p.edits); }catch(e){} }
    const js=eff;
    const ix=fnIndex(js);
    prog(L('Locating the faulty code…','正在定位问题代码…'));
    const st=JSON.stringify({state:{tab:curTab,symbol:sym0(),tf:tf0()},recent_errors:ERRS});
    const loc=parseJ(await callLLM('You are a senior JavaScript engineer debugging a single-file canvas charting web app. Answer ONLY with JSON: {"functions":["name",...],"search":["short literal strings that appear in the relevant code"]}. Pick at most 6 function names, from the index, most likely to contain the bug.',
      'BUG REPORT: '+desc+'\nSTATE: '+st+'\nFUNCTION INDEX (name):\n'+ix.out.map(x=>x.name).join(' '),[],700));
    let names=(loc.functions||[]).filter(n=>ix.out.find(x=>x.name===n)).slice(0,6);
    (loc.search||[]).slice(0,4).forEach(s=>{ if(!s||s.length<4) return; const li=ix.lines.findIndex(l=>l.includes(s)); if(li<0) return; let f=null; for(const x of ix.out){ if(x.line<=li) f=x; else break; } if(f&&!names.includes(f.name)&&names.length<8) names.push(f.name); });
    if(!names.length) throw new Error(L('I couldn\'t find which part of the app is responsible. Describe the problem a bit more.','没能定位到相关代码，请再描述详细一些。'));
    let code=''; names.forEach(n=>{ const s=fnSource(ix,n); if(s&&code.length<26000) code+='\n/* ===== '+n+' ===== */\n'+s; });
    let feedback='', patch=null, last='';
    for(let attempt=0;attempt<3&&!patch;attempt++){
      prog(L('Rewriting the code…'+(attempt?' (attempt '+(attempt+1)+')':''),'正在重写代码…'+(attempt?'（第'+(attempt+1)+'次）':'')));
      const fx=parseJ(await callLLM('You are a senior JavaScript engineer fixing a bug in a single-file canvas charting web app (plain browser JS, no modules). Answer ONLY with JSON: {"summary":"<one sentence of what you changed, in the user\'s language>","edits":[{"find":"<exact substring copied from the code below, unique, as short as possible but long enough to be unique>","repl":"<replacement>"}]}. Make the smallest safe change. Keep code valid and consistent with existing variable names. Never remove features. Each "find" must be copied character-for-character from the code provided.',
        'BUG REPORT: '+desc+'\nSTATE: '+st+'\n'+(feedback?'PROBLEM WITH YOUR PREVIOUS ATTEMPT: '+feedback+'\n':'')+'RELEVANT CODE:'+code,[],4000));
      try{
        const edits=(fx.edits||[]).filter(e=>e&&typeof e.find==='string'&&typeof e.repl==='string'&&e.find.length>0); if(!edits.length) throw new Error('no edits returned');
        const nj=applyEdits(eff,edits);
        try{ new Function(nj); }catch(se){ throw new Error('syntax error: '+se.message); }
        patch={summary:String(fx.summary||'Fix'),edits}; last=patch.summary;
      }catch(e){ feedback=String(e.message||e); }
    }
    if(!patch) throw new Error(L('I couldn\'t produce a safe fix this time ('+feedback+').','这次未能生成安全的修复（'+feedback+'）。'));
    const all=getP(); all.push({id:uid(),ts:Date.now(),desc:desc.slice(0,200),summary:patch.summary,edits:patch.edits,on:true}); setP(all);
    try{ localStorage.setItem('mi_boot_try','0'); }catch(_){} try{ save(); }catch(_){}
    prog(L('Fixed: ','已修复：')+patch.summary+'  '+L('Refreshing the charts…','正在刷新图表…'));
    setTimeout(()=>location.reload(),1600);
  }catch(e){ setState('active'); showDock(true); showCard(head(L('repair','修复'))+'<div class="mc-t">'+esc(String(e.message||e))+'</div><div class="mc-row"><button class="pri" data-c="more">OK</button></div>'); }
}

      const sg=e.target.closest('[data-seg] button'); if(sg){ const k=sg.parentNode.dataset.seg; if(k==='provider'){ const ki=b.querySelector('#miKey'), mi=b.querySelector('#miModel'); if(ki) A.keys[A.provider]=ki.value.trim(); if(mi&&mi.value.trim()) A.models[A.provider]=mi.value.trim(); } A[k]=sg.dataset.v; saveA(); sg.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===sg)); if(k==='provider'){ closeSheet(); openMenu(); } renderSettings(); return; }
      const pt=e.target.closest('[data-pt]'); if(pt){ const P=getP(), p=P.find(x=>x.id===pt.dataset.pt); if(p){ p.on=!p.on; setP(P); pt.classList.toggle('on',p.on); toast(L('Takes effect after refresh','刷新后生效')); } return; }
      const pdl=e.target.closest('[data-pd]'); if(pdl){ setP(getP().filter(x=>x.id!==pdl.dataset.pd)); rr(); toast(L('Deleted — refreshing…','已删除，正在刷新…')); setTimeout(()=>location.reload(),900); return; }
      if(e.target.closest('#miTest')){ A.keys[A.provider]=b.querySelector('#miKey').value.trim(); A.models[A.provider]=b.querySelector('#miModel').value.trim()||DEFA.models[A.provider]; saveA(); const out=b.querySelector('#miTestR'); out.style.color='var(--muted)'; out.textContent=L('Testing…','测试中…');
        callLLM('Reply ONLY with JSON {"ok":true}','ping',[],300).then(()=>{ out.style.color='#26a69a'; out.textContent=L('✓ Connected — Mi-Guy is ready','✓ 连接成功，Mi-Guy 已就绪'); }).catch(er=>{ out.style.color='#ef5350'; out.textContent='✗ '+(er.message==='NOKEY'?L('Paste a key first','请先粘贴密钥'):String(er.message).slice(0,160)); }); }
    });
  });
}
/* settings row */
const _rs=renderSettings;
renderSettings=function(){ _rs.apply(this,arguments); const g=q('#setGrid'); if(!g) return; const first=g.querySelector('.shd'); const html='<div class="shd">'+L('AI','AI')+'</div><button class="srow" data-act="miai"><span class="sic">'+AIICON+'</span><span class="sl">'+L('Mi-Guy AI','Mi-Guy AI')+'</span><span class="sv">'+(A.on?L('ON','开'):L('OFF','关'))+'</span><span class="chev">'+IC.chev+'</span></button><button class="srow" data-act="mimusic"><span class="sic"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></span><span class="sl">'+L('Music','音乐')+'</span><span class="sv">'+M.list.length+L(' songs',' 首')+'</span><span class="chev">'+IC.chev+'</span></button>'; if(first) first.insertAdjacentHTML('beforebegin',html); else g.insertAdjacentHTML('beforeend',html); };
q('#setGrid').addEventListener('click',e=>{ if(e.target.closest('[data-act="miai"]')) openMenu(); else if(e.target.closest('[data-act="mimusic"]')) openMusic(); });
renderSettings();


/* ---------- chatty mode: Mi-Guy watches what you do and speaks up ---------- */
const bub=q('#miBub'); let bubT=0;
function bubble(text){
  if(!A.on||state!=='idle') return; clearTimeout(bubT); bub.textContent=text; bub.classList.add('show');
  const w=Math.min(230,innerWidth-24); bub.style.width='auto'; bub.style.maxWidth=w+'px';
  const r=orb.getBoundingClientRect(), bh=bub.offsetHeight, bw=bub.offsetWidth;
  const left=r.left+r.width/2>innerWidth/2?r.right-bw:r.left; bub.style.left=clamp(left,8,innerWidth-bw-8)+'px';
  bub.style.top=(r.top>bh+70?r.top-bh-10:r.bottom+10)+'px';
  orb.classList.add('nudge'); setTimeout(()=>orb.classList.remove('nudge'),1800);
  if(A.method==='audio') speak(text,/[一-鿿]/.test(text)?'zh':'en');
  bubT=setTimeout(()=>bub.classList.remove('show'),11000);
}
bub.addEventListener('click',()=>{ bub.classList.remove('show'); clearTimeout(bubT); activate(); });
const EVL=[]; let sig0=null, revT=0, lastRev=0, revCount=[], aiQuiet=0;
const dsum=d=>{ const p=(d.pts||[]).map(x=>r6(x.p)); return d.type+(p.length?' @ '+p.slice(0,3).join(' / '):''); };
function chSig(){ return {tab:curTab,sym:sym0(),tf:tf0(),inds:Object.keys(S.chart.inds||{}).filter(k=>S.chart.inds[k]).sort(),dr:(DR||[]).map(d=>({id:d.id,s:dsum(d)})),tool:tool?tool.id:'',al:(S.alerts||[]).length}; }
function chDiff(a,b){ const out=[];
  if(a.tab!==b.tab) out.push('opened the '+b.tab+' tab');
  if(a.sym!==b.sym) out.push('switched instrument '+a.sym+' → '+b.sym);
  if(a.tf!==b.tf) out.push('changed timeframe '+a.tf+' → '+b.tf);
  b.inds.filter(x=>!a.inds.includes(x)).forEach(x=>out.push('added indicator '+x));
  a.inds.filter(x=>!b.inds.includes(x)).forEach(x=>out.push('removed indicator '+x));
  const ao=new Map(a.dr.map(d=>[d.id,d.s])); b.dr.forEach(d=>{ if(!ao.has(d.id)) out.push('drew '+d.s); else if(ao.get(d.id)!==d.s) out.push('moved a drawing to '+d.s); });
  const bo=new Set(b.dr.map(d=>d.id)); a.dr.forEach(d=>{ if(!bo.has(d.id)) out.push('deleted a '+d.s.split(' ')[0]); });
  if(a.tool!==b.tool&&b.tool) out.push('picked the '+b.tool+' tool');
  if(b.al>a.al) out.push('set a price alert');
  return out; }
function chatPoll(){
  if(document.hidden||!A.on||!A.chatty||typeof S==='undefined'||!SC&&curTab==='charts'&&!candles.length) { return; }
  let s; try{ s=chSig(); }catch(e){ return; }
  if(!sig0){ sig0=s; return; }
  const d=chDiff(sig0,s); sig0=s; if(!d.length) return;
  if(Date.now()<aiQuiet) return;
  d.forEach(t=>EVL.push({at:Date.now(),t:t})); while(EVL.length>12) EVL.shift();
  clearTimeout(revT); revT=setTimeout(chatReview,6000);
}
async function chatReview(){
  if(!A.on||!A.chatty||state!=='idle') return;
  const gap={calm:150,normal:75,lively:40}[A.chatLvl||'normal']*1000, now=Date.now();
  revCount=revCount.filter(x=>now-x<3600000); if(now-lastRev<gap||revCount.length>=18||!(A.keys[A.provider]||'').trim()) return;
  const ev=EVL.filter(e=>now-e.at<180000); if(!ev.length) return;
  lastRev=now; revCount.push(now);
  try{
    const lv=A.chatLvl||'normal';
    const sys='You are Mi-Guy, a friendly trading buddy watching over the user\'s shoulder as they chart. You are given their most recent actions and the current chart state. Speak up ONLY if something does not feel right or deserves a heads-up: e.g. a long/short or line that fights the prevailing trend, an entry at overbought/oversold RSI, poor risk/reward or a stop tighter than ~1 ATR, a drawing that looks misplaced, erratic hopping between timeframes or instruments, or piling on indicators. Be specific with numbers from the data. '+(lv==='lively'?'You may also add a short encouraging or useful remark when nothing is wrong. ':lv==='calm'?'Be selective: stay silent unless it really matters. ':'')+'Otherwise stay silent. Reply with ONLY JSON: {"say":"<1-2 short friendly sentences>"} or {"say":null}. Write in '+(zh()?'Chinese':'English')+'. No disclaimers.';
    const raw=await callLLM(sys,'RECENT ACTIONS (oldest first):\n'+ev.map(e=>'- '+Math.round((now-e.at)/1000)+'s ago: '+e.t).join('\n')+'\n\nSTATE:\n'+JSON.stringify(ctx()),[],300);
    const r=parseJ(raw); if(r&&r.say&&String(r.say).trim().length>2) bubble(String(r.say).trim());
  }catch(e){}
}
setInterval(chatPoll,1500);

/* ---------- MY EDGE bar: double-tap to pause / resume ---------- */
(function(){ const bar=q('#edgeBar'); if(!bar) return; let last=null, p0=null, moved=false;
  bar.addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; p0={x:e.clientX,y:e.clientY}; moved=false; },true);
  bar.addEventListener('pointermove',e=>{ if(p0&&Math.hypot(e.clientX-p0.x,e.clientY-p0.y)>7) moved=true; },true);
  bar.addEventListener('pointerup',e=>{ if(!p0) return; const p=p0; p0=null; if(moved){ last=null; return; }
    const now=Date.now(), dbl=last&&now-last.t<350&&Math.hypot(e.clientX-last.x,e.clientY-last.y)<30; last=dbl?null:{t:now,x:p.x,y:p.y}; if(!dbl) return;
    EDGE_PAUSED=!EDGE_PAUSED; bar.classList.toggle('ebhold',EDGE_PAUSED); try{ navigator.vibrate&&navigator.vibrate(15); }catch(_){}
    if(EDGE_PAUSED){ clearTimeout(edgeT); edgeT=null; } else { clearTimeout(edgeT); edgeT=setTimeout(edgeTick,1500); } },true);
  bar.addEventListener('pointercancel',()=>{ p0=null; },true); })();

applyShow();
try{ const rb=localStorage.getItem('mi_rolled'); if(rb){ localStorage.removeItem('mi_rolled'); setTimeout(()=>toast(L('A fix broke the app, so Mi-Guy switched it off.','某次修复导致应用异常，Mi-Guy 已将其关闭。')),1500); } }catch(_){}
setTimeout(()=>{ try{ localStorage.setItem('mi_boot_try','0'); }catch(_){} },5000);
window.MiGuy={ask:submit,activate,deactivate,run:runAction,repair};
})();
